name: Tests
on: [push, pull_request]
jobs:
  unit-and-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './evaluation[test,corpus,analysis]'
      - run: python -m pytest evaluation/tests -q
      - run: python -m unittest discover -s corpus/tools -p test_prompt_format.py -v
      - run: python corpus/tools/sync_prompts.py --evaluation-corpus evaluation/corpus --check
      - run: python corpus/tools/validate_specs.py
